apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mediwatch-data-pvc
  namespace: mediwatch
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mediwatch-models-pvc
  namespace: mediwatch
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 2Gi
