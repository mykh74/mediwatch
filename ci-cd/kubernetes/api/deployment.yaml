apiVersion: apps/v1
kind: Deployment
metadata:
  name: mediwatch-api
  namespace: mediwatch
  labels:
    app: mediwatch-api
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mediwatch-api
  template:
    metadata:
      labels:
        app: mediwatch-api
        version: v1
    spec:
      containers:
      - name: api
        image: mediwatch-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        envFrom:
        - configMapRef:
            name: mediwatch-config
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: models
          mountPath: /app/models
        - name: data
          mountPath: /app/data
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: mediwatch-models-pvc
      - name: data
        persistentVolumeClaim:
          claimName: mediwatch-data-pvc
