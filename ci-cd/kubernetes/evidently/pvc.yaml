apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: evidently-reports-pvc
  namespace: mediwatch
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: hostpath
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: evidently-data-pvc
  namespace: mediwatch
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: hostpath
