image:
  repository: evidently-worker
  tag: "latest"
  pullPolicy: Never # Crucial for Docker Desktop!
  restartPolicy: Never #called by Airflow, so we want it to exit after running the task

resources:
  requests:
    memory: "1Gi"
    cpu: "500m"

env:
  MLFLOW_TRACKING_URI: "localhost:5432"
  DATA_PATH: "s3://my-bucket/training-data"