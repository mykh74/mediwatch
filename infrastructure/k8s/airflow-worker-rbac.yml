apiVersion: v1
kind: Namespace
metadata:
  name: airflow-kpo # creates airflow-kpo namespace for KubernetesPodOperator tasks
---
apiVersion: v1
kind: ServiceAccount
metadata:
  namespace: airflow-kpo
  name: kpo-executor # Create a service account for the KubernetesPodOperator to use when launching pods
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: airflow-kpo
  name: pod-launcher-role #creates a role that allows the service account
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "pods/exec"]
  verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: airflow-kpo
  name: kpo-launcher-binding
subjects:
- kind: ServiceAccount
  name: kpo-executor
  namespace: airflow-kpo
roleRef:
  kind: Role
  name: pod-launcher-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: airflow-kpo
  name: airflow-scheduler-kpo-binding
subjects:
- kind: ServiceAccount
  name: airflow-api-server
  namespace: airflow
roleRef:
  kind: Role
  name: pod-launcher-role
  apiGroup: rbac.authorization.k8s.io