apiVersion: v1
kind: Namespace
metadata:
  name: airflow-worker
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: airflow-worker # <--- The target namespace from your error
  name: pod-launcher-role
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "pods/exec"]
  verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: airflow-worker # <--- The target namespace
  name: airflow-worker-launcher-binding
subjects:
- kind: ServiceAccount
  name: airflow-worker
  namespace: airflow # <--- The namespace where Airflow is actually installed
roleRef:
  kind: Role
  name: pod-launcher-role
  apiGroup: rbac.authorization.k8s.io