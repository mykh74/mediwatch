apiVersion: v1
kind: Namespace
metadata:
  name: airflow-kpo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: airflow-kpo
  name: kpo-launcher-role
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "pods/exec"]
  verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: airflow-kpo
  name: kpo-executor-binding
subjects:
- kind: ServiceAccount
  name: kpo-executor      # Must match the name in your values.yaml
  namespace: airflow      # Where Airflow is installed
roleRef:
  kind: Role
  name: kpo-launcher-role
  apiGroup: rbac.authorization.k8s.io