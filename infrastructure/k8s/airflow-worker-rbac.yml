apiVersion: v1
kind: Namespace
metadata:
  name: airflow-kpo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  namespace: airflow-kpo
  name: kpo-executor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: airflow-kpo
  name: pod-launcher-role
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "pods/exec"]
  verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: airflow-kpo
  name: kpo-launcher-binding
subjects:
- kind: ServiceAccount
  name: kpo-executor
  namespace: airflow-kpo
roleRef:
  kind: Role
  name: pod-launcher-role
  apiGroup: rbac.authorization.k8s.io