apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: C:\ProgramData\chocolatey\lib\kubernetes-kompose\tools\kompose.exe convert
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: airflow-init
  name: airflow-init
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: airflow-init
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: C:\ProgramData\chocolatey\lib\kubernetes-kompose\tools\kompose.exe convert
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: airflow-init
    spec:
      containers:
        - args:
            - -c
            - |
              if [[ -z "42395" ]]; then
                echo
                echo -e "\033[1;33mWARNING!!!: AIRFLOW_UID not set!\e[0m"
                echo "If you are on Linux, you SHOULD follow the instructions below to set "
                echo "AIRFLOW_UID environment variable, otherwise files will be owned by root."
                echo "For other operating systems you can get rid of the warning with manually created .env file:"
                echo "    See: https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#setting-the-right-airflow-user"
                echo
                export AIRFLOW_UID=$()(id -u)
              fi
              one_meg=1048576
              mem_available=$()(($()(getconf _PHYS_PAGES) * $()(getconf PAGE_SIZE) / one_meg))
              cpus_available=$()(grep -cE 'cpu[0-9]+' /proc/stat)
              disk_available=$()(df / | tail -1 | awk '{print $(4)}')
              warning_resources="false"
              if (( mem_available < 4000 )) ; then
                echo
                echo -e "\033[1;33mWARNING!!!: Not enough memory available for Docker.\e[0m"
                echo "At least 4GB of memory required. You have $()(numfmt --to iec $()((mem_available * one_meg)))"
                echo
                warning_resources="true"
              fi
              if (( cpus_available < 2 )); then
                echo
                echo -e "\033[1;33mWARNING!!!: Not enough CPUS available for Docker.\e[0m"
                echo "At least 2 CPUs recommended. You have $(){cpus_available}"
                echo
                warning_resources="true"
              fi
              if (( disk_available < one_meg * 10 )); then
                echo
                echo -e "\033[1;33mWARNING!!!: Not enough Disk space available for Docker.\e[0m"
                echo "At least 10 GBs recommended. You have $()(numfmt --to iec $()((disk_available * 1024 )))"
                echo
                warning_resources="true"
              fi
              if [[ $(){warning_resources} == "true" ]]; then
                echo
                echo -e "\033[1;33mWARNING!!!: You have not enough resources to run Airflow (see above)!\e[0m"
                echo "Please follow the instructions to increase amount of resources available:"
                echo "   https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#before-you-begin"
                echo
              fi
              echo
              echo "Creating missing opt dirs if missing:"
              echo
              mkdir -v -p /opt/airflow/{logs,dags,plugins,config}
              echo
              echo "Airflow version:"
              /entrypoint airflow version
              echo
              echo "Files in shared volumes:"
              echo
              ls -la /opt/airflow/{logs,dags,plugins,config}
              echo
              echo "Running airflow config list to create default config file if missing."
              echo
              /entrypoint airflow config list >/dev/null
              echo
              echo "Files in shared volumes:"
              echo
              ls -la /opt/airflow/{logs,dags,plugins,config}
              echo
              echo "Change ownership of files in /opt/airflow to 42395:0"
              echo
              chown -R "42395:0" /opt/airflow/
              echo
              echo "Change ownership of files in shared volumes to 42395:0"
              echo
              chown -v -R "42395:0" /opt/airflow/{logs,dags,plugins,config}
              echo
              echo "Files in shared volumes:"
              echo
              ls -la /opt/airflow/{logs,dags,plugins,config}
          command:
            - /bin/bash
          env:
            - name: AIRFLOW_CONFIG
              value: /opt/airflow/config/airflow.cfg
            - name: AIRFLOW__CELERY__BROKER_URL
              value: redis://:@redis:6379/0
            - name: AIRFLOW__CELERY__RESULT_BACKEND
              value: db+postgresql://airflow:airflow@postgres/airflow
            - name: AIRFLOW__CORE__AUTH_MANAGER
              value: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
            - name: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION
              value: "true"
            - name: AIRFLOW__CORE__EXECUTION_API_SERVER_URL
              value: http://airflow-apiserver:8080/execution/
            - name: AIRFLOW__CORE__EXECUTOR
              value: CeleryExecutor
            - name: AIRFLOW__CORE__FERNET_KEY
            - name: AIRFLOW__CORE__LOAD_EXAMPLES
              value: "true"
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              value: postgresql+psycopg2://airflow:airflow@postgres/airflow
            - name: AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK
              value: "true"
            - name: _AIRFLOW_DB_MIGRATE
              value: "true"
            - name: _AIRFLOW_WWW_USER_CREATE
              value: "true"
            - name: _AIRFLOW_WWW_USER_PASSWORD
              value: airflow
            - name: _AIRFLOW_WWW_USER_USERNAME
              value: airflow
            - name: _PIP_ADDITIONAL_REQUIREMENTS
          envFrom:
            - configMapRef:
                name: env
          image: apache/airflow:3.1.6
          name: airflow-init
          securityContext:
            runAsGroup: 0
            runAsUser: 0
          volumeMounts:
            - mountPath: /opt/airflow/config
              name: airflow-init-cm2
            - mountPath: /opt/airflow/plugins
              name: airflow-init-claim3
      restartPolicy: Always
      volumes:
        - configMap:
            name: airflow-init-cm2
          name: airflow-init-cm2
        - name: airflow-init-claim3
          persistentVolumeClaim:
            claimName: airflow-init-claim3
