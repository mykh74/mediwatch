# Configure MLflow to use the existing Postgres database
backendStore:
  databaseMigration: true
  postgres:
    enabled: true
    host: postgres-postgresql.default.svc.cluster.local
    port: 5432
    database: mlflow_db
    user: airflow_user
    password: MyAppPassword123

  # Connection string to the existing Postgres service
  # Format: postgresql://user:password@host:port/database
  # databaseConnectionString: postgresql://airflow_user:MyAppPassword123@postgres-postgresql.default.svc.cluster.local:5432/mlflow_db
